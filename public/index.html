<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MLT Chat</title>
<meta name="description" content="MLT Chat — your people, your moments. Post, watch, and hang out.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%2316305e'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="authView" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="auth-logo">MLT<span> Chat</span></div>
    <p class="auth-tag">Your people. Your moments. 🎈</p>
    <div id="authErr" class="err hidden"></div>
    <div class="auth-tabs">
      <button id="tabLogin" class="on" type="button">Log in</button>
      <button id="tabSignup" type="button">Sign up</button>
    </div>
    <form id="authForm">
      <div class="field hidden" id="fName">
        <label for="inName">Your name</label>
        <input id="inName" type="text" autocomplete="name" placeholder="e.g. Jamie Rivera" maxlength="40">
      </div>
      <div class="field">
        <label for="inUser">Username</label>
        <input id="inUser" type="text" autocomplete="username" placeholder="pick something fun" maxlength="20">
      </div>
      <div class="field">
        <label for="inPass">Password</label>
        <input id="inPass" type="password" autocomplete="current-password" placeholder="6+ characters">
      </div>
      <label class="check hidden" id="fYoung">
        <input id="inYoung" type="checkbox">
        <span><b>I'm under 18</b> — give me a Protected account 🛡️ <span style="color:#68779a">(extra safety, shows a small shield badge)</span></span>
      </label>
      <button class="btn red block" id="authSubmit" type="submit">Log in</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appView" class="hidden">
  <header class="topbar">
    <div class="topbar-in">
      <div class="logo">MLT<span> Chat</span></div>
      <div class="spacer"></div>
      <div class="me-chip"><span id="meAvatar"></span><span id="meName"></span></div>
    </div>
  </header>

  <main class="wrap">
    <!-- FEED -->
    <section id="view-feed">
      <div class="card composer">
        <div style="display:flex; gap:10px; align-items:flex-start">
          <span id="composerAvatar"></span>
          <textarea id="composerText" rows="2" placeholder="What's on your mind?"></textarea>
        </div>
        <div id="mediaPreview" class="media-preview hidden"></div>
        <div id="composerSong"></div>
        <div class="composer-row">
          <button class="chip-btn" id="btnPhoto" type="button">📷 Photo</button>
          <button class="chip-btn" id="btnVideoFile" type="button">🎬 Video</button>
          <button class="chip-btn" id="btnMusic" type="button">🎵 Music</button>
          <input type="file" id="filePhoto" accept="image/*" class="hidden">
          <input type="file" id="fileVideo" accept="video/mp4,video/webm,video/quicktime" class="hidden">
          <button class="post-btn" id="btnPost" type="button">Post</button>
        </div>
      </div>
      <div class="view-title"><span class="dot"></span> Public feed — everybody's posts</div>
      <div id="feedList"></div>
    </section>

    <!-- VIDEOS -->
    <section id="view-videos" class="hidden">
      <div class="pager-bar">
        <button class="nav-btn" id="pgPrev" type="button" aria-label="Previous video">‹</button>
        <span class="count" id="pgCount">1 / 1</span>
        <button class="nav-btn" id="pgNext" type="button" aria-label="Next video">›</button>
        <button class="sound-pill" id="soundPill" type="button">🔇 Sound OFF</button>
      </div>
      <div class="pager" id="pager"></div>
      <p style="color:var(--muted); font-size:13px; text-align:center; margin-top:10px">Swipe sideways through the videos 👉</p>
    </section>

    <!-- PEOPLE -->
    <section id="view-people" class="hidden">
      <div class="view-title"><span class="dot"></span> People on MLT</div>
      <div id="peopleList"></div>
    </section>

    <!-- FRIENDS -->
    <section id="view-friends" class="hidden">
      <div class="view-title"><span class="dot"></span> Friend requests</div>
      <div id="friendRequests"></div>
      <div class="view-title"><span class="dot"></span> My friends</div>
      <div id="friendList"></div>
      <div class="view-title"><span class="dot"></span> Requests I sent</div>
      <div id="friendOutgoing"></div>
    </section>

    <!-- PROFILE -->
    <section id="view-profile" class="hidden">
      <div class="card profile-head">
        <span id="profAvatar"></span>
        <div class="nm" id="profName"></div>
        <div class="sub" id="profSub"></div>
        <div class="stats">
          <div class="stat"><b id="stPosts">0</b><span>Posts</span></div>
          <div class="stat"><b id="stLikes">0</b><span>Likes</span></div>
          <div class="stat"><b id="stComments">0</b><span>Comments</span></div>
        </div>
        <div class="edit-row">
          <input id="editName" type="text" maxlength="40" placeholder="Change your name">
          <button class="btn" id="btnSaveName" type="button">Save</button>
        </div>
        <button class="btn ghost block" id="btnLogout" type="button" style="margin-top:12px">Log out</button>
      </div>
      <div class="view-title"><span class="dot"></span> My posts</div>
      <div id="myPosts"></div>
    </section>
  </main>

  <nav class="bottomnav">
    <div class="bottomnav-in">
      <button data-nav="feed" class="on" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Feed</button>
      <button data-nav="videos" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>Videos</button>
      <button data-nav="people" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M16 15.2c2.3.3 4.3 1.8 5 4.3"/></svg>People</button>
      <button data-nav="friends" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.7-3.4 3.2-5.2 6.5-5.2 1.4 0 2.7.3 3.8 1"/><path d="m15.5 18.3 2 2 3.6-3.9"/></svg>Friends</button>
      <button data-nav="profile" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c1-4 4-6 7.5-6s6.5 2 7.5 6"/></svg>Profile</button>
    </div>
  </nav>
</div>

<!-- ============ FULL-SCREEN VIEWER ============ -->
<div id="viewer" class="overlay hidden">
  <div class="viewer-top">
    <b id="viewerTitle">Video</b>
    <button class="sound-pill on" id="viewerSound" type="button">🔊 Sound ON</button>
    <button class="x" id="viewerClose" type="button" aria-label="Close">✕</button>
  </div>
  <div class="viewer-stage">
    <video id="viewerVideo" playsinline loop></video>
    <button class="viewer-nav prev" id="viewerPrev" type="button" aria-label="Previous">‹</button>
    <button class="viewer-nav next" id="viewerNext" type="button" aria-label="Next">›</button>
  </div>
  <audio id="viewerAudio" loop></audio>
</div>

<!-- ============ SHEET (comments / music) ============ -->
<div id="sheet" class="sheet hidden">
  <div class="sheet-in">
    <button class="x" id="sheetClose" type="button" aria-label="Close">✕</button>
    <h3 id="sheetTitle">Comments</h3>
    <div id="sheetBody"></div>
  </div>
</div>

<!-- ============ INCOMING CALL POPUP ============ -->
<div id="callPopup" class="call-popup hidden">
  <div class="call-popup-in">
    <span id="callFromAvatar"></span>
    <div class="call-from" id="callFromName">Someone</div>
    <p class="call-sub">is video calling you… 📹</p>
    <div class="call-popup-btns">
      <button class="btn green" id="btnCallAccept" type="button">✓ Accept</button>
      <button class="btn red" id="btnCallDecline" type="button">✕ Decline</button>
    </div>
  </div>
</div>

<!-- ============ IN-CALL SCREEN ============ -->
<div id="callView" class="overlay hidden">
  <div class="viewer-top">
    <b id="callPeerName">Video call</b>
    <span id="callStatus" class="call-status">Calling…</span>
  </div>
  <div class="call-stage">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>
  <div class="call-controls">
    <button class="call-ctl" id="btnMute" type="button">🎤<span>Mute</span></button>
    <button class="call-ctl" id="btnCam" type="button">📷<span>Camera</span></button>
    <button class="call-ctl hangup" id="btnHangup" type="button">📞<span>Hang up</span></button>
  </div>
</div>

<audio id="songAudio" loop></audio>
<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
