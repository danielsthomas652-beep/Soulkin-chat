# Render Blueprint for Solkin Chat — free web service + Turso database.
# Render provides PORT automatically; the app reads process.env.PORT.
# TURSO_DATABASE_URL / TURSO_AUTH_TOKEN: create the database at turso.tech
# first, then paste the values in the Render dashboard (sync: false = the
# values are entered in Render, never committed to the repo).
# SESSION_SECRET is generated by Render so login cookies survive restarts.
services:
  - type: web
    name: solkin-chat
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
